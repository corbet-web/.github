name: Bug report
description: Report a reproducible defect.
title: "[bug]: "
labels: [bug]
body:
  - type: input
    id: repo
    attributes:
      label: Repository and version
      description: Repo name plus tag or commit SHA.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Smallest snippet plus commands run. No private values, credentials, or secrets.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: No private hostnames, IPs, user paths, credentials, counterparty data, or secrets are included.
          required: true
